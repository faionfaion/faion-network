# purpose: Header block of the weekly dependency aging chart artefact: who owns it, which checkpoint it is for, how it was extracted, and the bands fixed at adoption.
# consumes: the checkpoint calendar, the saved tracker query and the previous artefact's age_bands / bands_adopted_on.
# produces: the first eight keys of the artefact in content/02-output-contract.xml, ready to drop in front of edges[].
# depends-on: content/02-output-contract.xml (field names and formats); templates/skeleton.md.j2 for the checkpoint page.
# token-budget-impact: <80 tokens per artefact.

program: <program name>
owner: program-pm:<handle>          # the named program PM; a person, never a team
chart_date: YYYY-MM-DD              # falls on checkpoint_weekday
checkpoint_weekday: Monday          # Monday..Sunday; the chart is regenerated on the same weekday every week
tracker_query: <saved query the script runs>
extracted_at: YYYY-MM-DDThh:mm:ssZ  # within the checkpoint week, never after chart_date
age_bands:                          # fixed at bands_adopted_on; contiguous from 0, open top band
  - {label: "0-7", min_days: 0, max_days: 7}
  - {label: "8-14", min_days: 8, max_days: 14}
  - {label: "15-28", min_days: 15, max_days: 28}
  - {label: "over 28", min_days: 29, max_days: null}
bands_adopted_on: YYYY-MM-DD
