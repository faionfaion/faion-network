# purpose: Frontmatter for the contract artefact (version / committed_on / post_hoc / evidence_root / review_cadence)
# consumes: builder-provided commit date + repo path
# produces: artefact conforming to content/02-output-contract.xml
# depends-on: content/01-core-rules.xml
# token-budget-impact: ~80-200 tokens when loaded as context
version: 1.0.0          # bump with a change_log reason for every parameter change; never inside a window
committed_on: ""        # YYYY-MM-DD; must precede the first month-end at or above the threshold
post_hoc: false         # true when first committed after a qualifying month-end; that window is void
evidence_root: ""       # path or URL prefix where evidence links (provider report, runway model) resolve
review_cadence: quarterly   # monthly | quarterly
