# purpose: Header block of the portfolio EVM rollup: the fields every row and sum is reported against.
# consumes: the executive review calendar and the portfolio owner's name.
# produces: the first six keys of the artefact in content/02-output-contract.xml, ready to drop in front of the projects table.
# depends-on: content/02-output-contract.xml (field names and formats); templates/skeleton.json for the rest of the artefact.
# token-budget-impact: <60 tokens per artefact.

portfolio: <portfolio name>
owner: portfolio:<handle>       # the portfolio owner who signs before the review; a person, never a team
data_date: YYYY-MM-DD           # the one data date every project row is reported as of
currency: USD                   # ISO 4217; every row is converted to it before summing
reporting_period: month         # week | fortnight | month; a ledger older than one period is stale
executive_review_date: YYYY-MM-DD
