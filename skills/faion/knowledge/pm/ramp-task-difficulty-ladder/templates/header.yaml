# purpose: Frontmatter schema for the ramp-task difficulty ladder spec — keys must match content/02-output-contract.xml `header` exactly.
# consumes: The header block at the top of templates/skeleton.md.
# produces: A consistent, validator-friendly frontmatter.
# depends-on: scripts/validate-ramp-task-difficulty-ladder.py.
# token-budget-impact: zero — pure schema.

version: "1.0.0"               # semver; bumped at every outcome review that re-bands or rewrites a rung
owner: "tech-lead:<person>"    # role:person; team-level ownership is forbidden
last_reviewed: "2026-05-22"    # ISO date of the last outcome review
ramp_window_days: 10           # working days in the ramp; the top rung's upper bound must fit inside it
review_cadence: "quarterly"    # one of: monthly, quarterly (quarterly at most)
rung_label_prefix: "ramp/rung-" # tracker label prefix; tickets are tagged <prefix><rung> before the start date
