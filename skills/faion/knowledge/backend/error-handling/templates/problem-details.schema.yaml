# purpose: JSON Schema 2020-12 for the ProblemDetails response body — drop-in for jsonschema/ajv/schemathesis.
# consumes: an HTTP error response body from any endpoint of the service.
# produces: a pass/fail verdict used by the CI contract test.
# depends-on: content/01-core-rules.xml rules r-envelope-required-fields and r-errors-array-scope.
# token-budget-impact: zero — local-only template; CI time is the only cost.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://api.example.com/schemas/problem-details"
type: object
required: [type, title, status]
properties:
  type:
    type: string
    format: uri
  title:
    type: string
    minLength: 1
  status:
    type: integer
    minimum: 100
    maximum: 599
  detail:
    type: string
  instance:
    type: string
  traceId:
    type: string
    minLength: 1
  errors:
    type: array
    items:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
additionalProperties: true
