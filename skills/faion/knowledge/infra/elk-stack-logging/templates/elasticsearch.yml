# purpose: Elasticsearch config skeleton with security + ILM
# consumes: see content/02-output-contract.xml inputs
# produces: artefact conforming to content/02-output-contract.xml
# depends-on: content/01-core-rules.xml
# token-budget-impact: ~200 tokens when loaded as context

# Elasticsearch 8.x node config. One file per node; only node.name / node.roles
# differ between hot, warm and cold nodes. Secrets never live here: bootstrap
# password comes from ELASTIC_PASSWORD at first start, keystore passphrases via
# `elasticsearch-keystore add`. Certificates are generated by `elasticsearch-certutil`
# and mounted read-only under config/certs.
cluster.name: <cluster-name>
node.name: <node-name>
# ILM data tiers: hot nodes get [master, data_hot, ingest], warm [data_warm], cold [data_cold].
node.roles: [master, data_hot, ingest]
path.data: /var/lib/elasticsearch
path.logs: /var/log/elasticsearch

# security-enabled: never bind 0.0.0.0 without auth. Bind to the private interface
# and require TLS on both the HTTP and transport layers.
network.host: _site_
http.port: 9200
transport.port: 9300
discovery.seed_hosts:
  - <es-node-1>.<internal-domain>:9300
  - <es-node-2>.<internal-domain>:9300
  - <es-node-3>.<internal-domain>:9300
cluster.initial_master_nodes:
  - <node-name-1>
  - <node-name-2>
  - <node-name-3>

xpack.security.enabled: true
xpack.security.enrollment.enabled: false
xpack.security.authc.api_key.enabled: true
# agent-mtls-or-token: Filebeat presents a client certificate (see filebeat.yml).
# `required` makes the HTTP layer reject any client without one; use `optional`
# only if Kibana and API-token agents share this endpoint.
xpack.security.http.ssl.enabled: true
xpack.security.http.ssl.client_authentication: required
xpack.security.http.ssl.key: certs/<node-name>/<node-name>.key
xpack.security.http.ssl.certificate: certs/<node-name>/<node-name>.crt
xpack.security.http.ssl.certificate_authorities: [certs/ca/ca.crt]
xpack.security.transport.ssl.enabled: true
xpack.security.transport.ssl.verification_mode: certificate
xpack.security.transport.ssl.client_authentication: required
xpack.security.transport.ssl.key: certs/<node-name>/<node-name>.key
xpack.security.transport.ssl.certificate: certs/<node-name>/<node-name>.crt
xpack.security.transport.ssl.certificate_authorities: [certs/ca/ca.crt]
# Audit trail for the compliance regime that justified ELK in the first place.
xpack.security.audit.enabled: true
xpack.security.audit.logfile.events.include: [access_denied, authentication_failed, connection_denied]

# ilm-required: ILM is always on in 8.x; these settings make the policy from
# templates/ilm-policy.json take effect promptly and keep tiers honest.
indices.lifecycle.poll_interval: 10m
indices.lifecycle.history_index_enabled: true
cluster.routing.allocation.disk.watermark.low: 85%
cluster.routing.allocation.disk.watermark.high: 90%
cluster.routing.allocation.disk.watermark.flood_stage: 95%
# Only the hot tier accepts new writes; rollover moves data down the tiers.
cluster.routing.allocation.awareness.attributes: zone
node.attr.zone: <availability-zone>

# structured-logs-only is enforced at the agent (filebeat.yml ndjson parser) and
# by the index template; nothing here parses plain text.
action.auto_create_index: "logs-*,.kibana*,.monitoring*"
action.destructive_requires_name: true
