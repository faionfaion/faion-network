<!-- GA4 gtag.js installation — replace G-XXXXXXXXXX with your Measurement ID -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  // Consent Mode v2 defaults MUST precede gtag('config') (rule r-consent-mode-v2-defaults-before-config).
  // All four signals default to 'denied'; the consent management platform calls
  // gtag('consent', 'update', {...}) once the user chooses. Add a `region` array
  // to scope these defaults to consent jurisdictions if non-EEA traffic may default to 'granted'.
  gtag('consent', 'default', {
    'ad_storage': 'denied',
    'analytics_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied',
    'wait_for_update': 500
  });

  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX');
</script>
