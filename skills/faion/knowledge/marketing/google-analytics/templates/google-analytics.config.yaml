# purpose: google-analytics config template
# consumes: inputs named in AGENTS.md Prerequisites
# produces: artefact conforming to content/02-output-contract.xml
# depends-on: content/01-core-rules.xml + content/06-decision-tree.xml
# token-budget-impact: ~500 tokens when loaded
slug: google-analytics
owner: ""
settings:
  property_id: ""                # numeric property id (Data API, BigQuery); r-property-id-and-measurement-id-distinct
  measurement_id: ""             # G-XXXXXXXXXX (gtag, Measurement Protocol)
  stream: ""
  consent_mode: "v2"             # basic | advanced implementation recorded in consent_mode_implementation
  consent_mode_implementation: ""
  enhanced_measurement:          # r-enhanced-measurement-declared-no-double-page-view
    page_views: true
    history_change_page_view: true   # set false when the app sends page_view manually
    scrolls: true
    outbound_clicks: true
    site_search: false
    video_engagement: false
    file_downloads: true
    form_interactions: false
  custom_dimensions: []          # [{name, parameter, scope: event|user|item}]; r-custom-dimensions-registered-within-limits
  key_events: []                 # [{event_name, counting: once_per_event|once_per_session}]; r-key-events-declared-by-exact-name
  bigquery_export:               # r-bigquery-export-linked-before-launch
    linked: false
    dataset_location: ""
    daily: true
    streaming: false
  data_retention_months: 14
  internal_traffic_ips: []       # filter must be active, not testing
  unwanted_referrals: []         # payment + auth domains
  cross_domain_list: []
deviation_log_reference: ""
