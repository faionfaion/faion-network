# purpose: conversion-tracking config template
# consumes: inputs named in AGENTS.md Prerequisites
# produces: artefact conforming to content/02-output-contract.xml
# depends-on: content/01-core-rules.xml + content/06-decision-tree.xml
# token-budget-impact: ~500 tokens when loaded
slug: conversion-tracking
owner: ""
settings:
  property_id: ""
  stream: ""
  consent_mode: "v2"
  event_registry: "events.yml"          # r-event-registry-single-source; validate-events.py runs in CI
  destinations: []                      # e.g. ga4, google_ads, meta_capi, plausible
  transaction_id_field: "transaction_id" # r-monetary-conversion-carries-transaction-id; reused as Meta event_id
  server_endpoint: ""                   # first-party subdomain, e.g. gtm.example.com (r-server-endpoint-first-party-domain)
  qa_browsers: ["chrome", "safari", "firefox"]
  qa_adblock_profile: true              # r-qa-fixtures-per-tracking-change
deviation_log_reference: ""
