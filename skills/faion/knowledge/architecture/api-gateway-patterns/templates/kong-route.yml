# purpose: Kong declarative route honouring the stateless-gateway and consumer-rate-limit rules.
# consumes: service name, upstream host/port, route path, per-environment rate limits
# produces: a deck-syncable kong.yml fragment for the selected gateway (r6, r7, r8, r11)
# depends-on: content/01-core-rules.xml, content/05-examples.xml
# token-budget-impact: ~300 tokens when loaded as context
# Kong declarative route template (deck sync compatible)
# Replace <service-name>, <url>, <path>, and rate limits per environment.
_format_version: "3.0"

services:
  - name: <service-name>
    url: http://<service-host>:<port>
    connect_timeout: 5000
    read_timeout: 5000
    write_timeout: 5000
    routes:
      - name: <route-name>
        paths:
          - /api/<path>
        strip_path: false
        preserve_host: true
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
      - name: rate-limiting
        config:
          minute: 60
          policy: redis
          limit_by: consumer
          redis_host: redis
          redis_port: 6379
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid
          echo_downstream: true
