# faion_header_json: {"__faion_header__":{"purpose":"Sample Lambda config with provisioned concurrency + SnapStart settings.","consumes":"see content/02-output-contract.xml","produces":"spec","depends_on":"content/01-core-rules.xml#r4-provisioned-concurrency-is-a-trade + content/01-core-rules.xml#r3-runtime-cold-start-ranking","token_budget_impact":"~210 tokens when loaded as context"}}
Resources:
  MyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: java21
      MemorySize: 1024
      Timeout: 10
      SnapStart:
        ApplyOn: PublishedVersions
      AutoPublishAlias: live
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: 2
