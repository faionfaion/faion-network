# purpose: pnpm workspace definition for an apps / packages / tools layout.
# consumes: repo directory layout.
# produces: workspace pnpm resolves `workspace:*` against.
# depends-on: content/01-core-rules.xml#r3.
# token-budget-impact: 0 — YAML config.

packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'
