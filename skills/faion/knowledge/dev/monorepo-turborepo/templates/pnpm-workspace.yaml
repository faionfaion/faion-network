# purpose: pnpm workspace declaration
# consumes: See content/02-output-contract.xml inputs
# produces: artefact conforming to content/02-output-contract.xml
# depends-on: content/01-core-rules.xml
# token-budget-impact: ~200-1000 tokens when loaded as context
# Two product tiers (r7-two-tier-layout): apps/* deployables, packages/* libraries.
# tools/* is the one allowed exception — non-published build tooling that no
# package imports. Anything importable belongs in packages/*.
packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'
